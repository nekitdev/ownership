[workspace]
members = ["derive"]

[workspace.package]
version = "0.4.0"
authors = ["nekitdev <nekit@nekit.dev>"]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/nekitdev/ownership"
license = "MIT"

[package]
name = "ownership"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Obtaining ownership."
documentation = "https://docs.rs/ownership"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["ownership", "owned"]
categories = ["rust-patterns", "no-std", "no-std::no-alloc"]

[workspace.dependencies.proc-macro2]
version = "1.0.107"
default-features = false

[workspace.dependencies.quote]
version = "1.0.47"
default-features = false

[workspace.dependencies.syn]
version = "3.0.6"
default-features = false

[workspace.dependencies.trait-aliases]
version = "0.4.0"
default-features = false

[dependencies.ownership-derive]
path = "derive"
version = "0.4.0"
optional = true

[features]
default = ["std"]
derive = ["dep:ownership-derive"]
std = []
alloc = []

[package.metadata.docs.rs]
features = ["derive"]
rustdoc-args = ["--cfg", "docsrs"]
