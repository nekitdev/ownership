[package]
name = "ownership-derive"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Derive macros for obtaining ownership."
documentation = "https://docs.rs/ownership-derive"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["ownership", "derive", "macro"]

[lib]
proc-macro = true

[dependencies.proc-macro2]
workspace = true
features = ["proc-macro"]

[dependencies.quote]
workspace = true
features = ["proc-macro"]

[dependencies.trait-aliases]
workspace = true

[dependencies.syn]
workspace = true
features = [
    "derive",
    "parsing",
    "printing",
    "visit",
    "proc-macro",
    "clone-impls",
]
